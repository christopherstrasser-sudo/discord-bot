name: Build RAKU Launcher EXE

on:
  push:
    branches:
      - tmp-raku-launcher-build

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recreate launcher source archive
        shell: pwsh
        run: |
          $parts = 0..3 | ForEach-Object { (Get-Content ".raku-launcher-build/chunk$_.txt" -Raw).Trim() }
          $b64 = ($parts -join "")
          if ($b64.Length -ne 30508) { throw "Unexpected base64 length: $($b64.Length)" }
          $bytes = [Convert]::FromBase64String($b64)
          [IO.File]::WriteAllBytes("$env:GITHUB_WORKSPACE\launcher.zip", $bytes)
          $hash = (Get-FileHash "$env:GITHUB_WORKSPACE\launcher.zip" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "04c9931894445b831e68f8a8d5781d02511cdd7493701a5dbe2ef38b0eaa62a4") {
            throw "Launcher archive checksum mismatch: $hash"
          }
          Expand-Archive "$env:GITHUB_WORKSPACE\launcher.zip" -DestinationPath "$env:GITHUB_WORKSPACE\launcher-src" -Force

      - name: Patch v0.1.2 preload/runtime fix
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE\launcher-src\raku-launcher-v0.1.1"

          $pkgPath = Join-Path $root "package.json"
          $pkg = Get-Content $pkgPath -Raw | ConvertFrom-Json
          $pkg.version = "0.1.2"
          $pkg | ConvertTo-Json -Depth 20 | Set-Content $pkgPath -Encoding utf8

          $configPath = Join-Path $root "electron.vite.config.mjs"
          @'
          import { defineConfig } from 'electron-vite'
          import react from '@vitejs/plugin-react'

          export default defineConfig({
            main: {
              build: {
                rollupOptions: {
                  input: 'src/main/index.js'
                }
              }
            },
            preload: {
              build: {
                rollupOptions: {
                  input: 'src/preload/index.js',
                  output: {
                    format: 'cjs',
                    entryFileNames: 'index.js'
                  }
                }
              }
            },
            renderer: {
              root: 'src/renderer',
              plugins: [react()]
            }
          })
          '@ | Set-Content $configPath -Encoding utf8

          $rendererPath = Join-Path $root "src\renderer\src\main.jsx"
          $renderer = Get-Content $rendererPath -Raw
          $renderer = $renderer -replace "useEffect\(\(\) => \{\r?\n    refresh\(\)\.catch", "useEffect(() => {`n    if (!window.raku) return`n    refresh().catch"
          $boot = '  if (!state) return <div className="boot"><div className="boot-mark">R</div><span>RAKU Launcher startet</span></div>'
          $fallback = '  if (!window.raku) return <div className="boot"><div className="boot-mark">!</div><span>Launcher-Bridge konnte nicht geladen werden · PRELOAD_BRIDGE</span></div>' + "`n" + $boot
          if (-not $renderer.Contains($boot)) { throw "Renderer boot marker not found" }
          $renderer = $renderer.Replace($boot, $fallback)
          Set-Content $rendererPath $renderer -Encoding utf8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: launcher-src/raku-launcher-v0.1.1
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Build Electron application
        working-directory: launcher-src/raku-launcher-v0.1.1
        shell: pwsh
        run: |
          npm run build
          if (-not (Test-Path "out\preload\index.js")) { throw "CommonJS preload missing" }
          if (Test-Path "out\preload\index.mjs") { throw "Unexpected ESM preload generated" }

      - name: Package portable Windows EXE
        working-directory: launcher-src/raku-launcher-v0.1.1
        shell: pwsh
        run: npx electron-builder --win portable --x64

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: RAKU-Launcher-Windows-v0.1.2
          path: launcher-src/raku-launcher-v0.1.1/release/*.exe
          if-no-files-found: error
          retention-days: 1
