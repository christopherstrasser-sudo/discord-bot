name: JavaScript Quality Gate

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find src public tests -type f -name '*.js' -print0)

      - name: Check CSS syntax sanity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap(entry => {
              const full = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(full) : [full];
            });
          }
          function checkCss(file) {
            const text = fs.readFileSync(file, 'utf8');
            let braces = 0, quote = null, comment = false, escape = false;
            for (let i = 0; i < text.length; i += 1) {
              const ch = text[i], next = text[i + 1];
              if (comment) { if (ch === '*' && next === '/') { comment = false; i += 1; } continue; }
              if (quote) {
                if (escape) { escape = false; continue; }
                if (ch === '\\') { escape = true; continue; }
                if (ch === quote) quote = null;
                continue;
              }
              if (ch === '/' && next === '*') { comment = true; i += 1; continue; }
              if (ch === '"' || ch === "'") { quote = ch; continue; }
              if (ch === '{') braces += 1;
              if (ch === '}') braces -= 1;
              if (braces < 0) throw new Error(`${file}: unexpected closing brace`);
            }
            if (comment || quote || braces !== 0) throw new Error(`${file}: invalid CSS structure`);
            console.log(`CSS OK ${file}`);
          }
          for (const file of walk('public').filter(file => file.endsWith('.css'))) checkCss(file);
          NODE

      - name: Check Orbit and Creator Social contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('public/index.html', 'utf8');
          const required = [
            '/raku-orbit-v610.css',
            '/raku-orbit-v600.js',
            '/raku-module-shell.css',
            '/raku-module-shell.js',
            '/creator-social-extension.css',
            '/creator-social-extension.js'
          ];
          for (const asset of required) {
            const count = html.split(asset).length - 1;
            if (count !== 1) throw new Error(`Expected exactly one ${asset} reference, found ${count}`);
          }
          if (!html.includes('v=0270')) throw new Error('v0.27 UI cache key missing');

          for (const file of ['src/creator-social-providers.js', 'src/creator-instagram-keyless.js', 'src/creator-social-provider-router.js', 'src/creator-social-runtime.js']) {
            if (!fs.existsSync(file)) throw new Error(`Missing ${file}`);
          }
          if (fs.existsSync('src/creator-social-browser.js')) throw new Error('Local browser social fallback must stay retired');
          if (fs.existsSync('tests/creator-social-browser.test.js')) throw new Error('Obsolete browser fallback test must stay retired');

          const api = fs.readFileSync('src/creator-hub-api.js', 'utf8');
          for (const token of ["'instagram'", "'bluesky'", "'x'", "new Set(['post'])", 'shouldPublishCheckedRule', 'publishCheckedSnapshot', 'publishError', 'allowPing: false']) {
            if (!api.includes(token)) throw new Error(`Creator Social API token missing: ${token}`);
          }

          const runtime = fs.readFileSync('src/creator-social-runtime.js', 'utf8');
          if (!runtime.includes("require('./creator-social-provider-router')")) throw new Error('Creator social runtime must use provider router');

          const router = fs.readFileSync('src/creator-social-provider-router.js', 'utf8');
          for (const token of ['x.pcstyle.dev/api/v1/profiles/', "require('./creator-instagram-keyless')", 'SCRAPECREATORS_API_KEY', 'RAKU_SOCIAL_RELAY_URL']) {
            if (!router.includes(token)) throw new Error(`Provider router token missing: ${token}`);
          }
          if (/puppeteer|findBrowserExecutable|creator-social-browser/i.test(router)) throw new Error('Provider router must not use a local browser');

          const instagram = fs.readFileSync('src/creator-instagram-keyless.js', 'utf8');
          for (const token of ["import('impit')", "browser: 'chrome'", '/web/search/topsearch/', '/api/v1/feed/user/', '7950326061742207', '/graphql/query/', 'parseGraphqlTimeline']) {
            if (!instagram.includes(token)) throw new Error(`Instagram keyless resolver token missing: ${token}`);
          }
          if (/puppeteer|findBrowserExecutable|creator-social-browser/i.test(instagram)) throw new Error('Instagram keyless resolver must not use a local browser');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.version !== '0.27.1') throw new Error(`Expected package version 0.27.1, got ${pkg.version}`);
          if (!pkg.dependencies?.impit) throw new Error('impit dependency missing');

          const socialUi = fs.readFileSync('public/creator-social-extension.js', 'utf8');
          for (const token of ['BROWSERLESS HTTP', 'X.MD RELAY', 'kein lokaler Browser', 'appendProviderCards']) {
            if (!socialUi.includes(token)) throw new Error(`Creator Social UI token missing: ${token}`);
          }

          const actions = fs.readFileSync('public/creator-hub-actions.js', 'utf8');
          for (const token of ['aktuellster Inhalt wurde in Discord gepostet', 'result.publishError', 'Quelle erfolgreich geprüft']) {
            if (!actions.includes(token)) throw new Error(`Creator check feedback missing: ${token}`);
          }
          console.log('Orbit + Creator Social v0.27.1 contract verified');
          NODE

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Load creator social modules
        run: |
          node -e "require('./src/creator-social-providers'); require('./src/creator-instagram-keyless'); require('./src/creator-social-provider-router'); require('./src/creator-social-runtime'); console.log('Creator social modules loaded')"
          node -e "import('impit').then(m => { if (!m.Impit) process.exit(1); console.log('impit transport loaded') })"

      - name: Run automated tests
        run: node --test tests/*.test.js
