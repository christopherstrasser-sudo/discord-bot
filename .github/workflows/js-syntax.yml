name: JavaScript Quality Gate

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find src public -type f -name '*.js' -print0)
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Load critical backend modules
        env:
          DISCORD_CLIENT_ID: ci-client
          DISCORD_CLIENT_SECRET: ci-secret
          DISCORD_BOT_TOKEN: ci-token
          SESSION_SECRET: ci-session-secret
          PUBLIC_BASE_URL: http://127.0.0.1:3000
        run: |
          node -e "require('./src/creator-store'); require('./src/creator-providers'); require('./src/creator-runtime'); require('./src/creator-hub-api'); require('./src/ticket-store'); require('./src/ticket-studio-runtime'); require('./src/ticket-studio-api'); console.log('Critical modules loaded successfully')"
