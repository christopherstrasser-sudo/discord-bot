name: JavaScript Quality Gate

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find src public tests -type f -name '*.js' -print0)

      - name: Check CSS syntax sanity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap(entry => {
              const full = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(full) : [full];
            });
          }
          function checkCss(file) {
            const text = fs.readFileSync(file, 'utf8');
            let braces = 0, quote = null, comment = false, escape = false;
            for (let i = 0; i < text.length; i += 1) {
              const ch = text[i], next = text[i + 1];
              if (comment) { if (ch === '*' && next === '/') { comment = false; i += 1; } continue; }
              if (quote) {
                if (escape) { escape = false; continue; }
                if (ch === '\\') { escape = true; continue; }
                if (ch === quote) quote = null;
                continue;
              }
              if (ch === '/' && next === '*') { comment = true; i += 1; continue; }
              if (ch === '"' || ch === "'") { quote = ch; continue; }
              if (ch === '{') braces += 1;
              if (ch === '}') braces -= 1;
              if (braces < 0) throw new Error(`${file}: unexpected closing brace`);
            }
            if (comment || quote || braces !== 0) throw new Error(`${file}: invalid CSS structure`);
            console.log(`CSS OK ${file}`);
          }
          for (const file of walk('public').filter(file => file.endsWith('.css'))) checkCss(file);
          NODE

      - name: Check Orbit product contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('public/index.html', 'utf8');
          const required = [
            '/raku-orbit-v610.css',
            '/raku-orbit-v600.js',
            '/raku-module-shell.css',
            '/raku-module-shell.js',
            '/creator-social-extension.css',
            '/creator-social-extension.js',
            '/bot-profile.css',
            '/bot-profile.js',
            '/orbit-wordmark.svg'
          ];
          for (const asset of required) {
            const count = html.split(asset).length - 1;
            if (count < 1) throw new Error(`Required asset missing from index: ${asset}`);
          }
          if (!html.includes('v=0290')) throw new Error('Base Orbit UI cache key missing');
          if (!html.includes('<title>ORBIT')) throw new Error('ORBIT browser title missing');
          if (!html.includes('alt="ORBIT"')) throw new Error('ORBIT wordmark is not wired into UI');
          if (/RAKU Discord Control|>RAKU<|RAKU DISCORD/i.test(html)) throw new Error('Visible legacy RAKU branding remains in index.html');
          if (!fs.existsSync('public/orbit-wordmark.svg')) throw new Error('Approved ORBIT wordmark asset missing');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.name !== 'orbit-discord-control') throw new Error(`Unexpected package name: ${pkg.name}`);
          if (pkg.version !== '0.30.0') throw new Error(`Expected package version 0.30.0, got ${pkg.version}`);

          const readme = fs.readFileSync('README.md', 'utf8');
          const launcher = fs.readFileSync('start.cmd', 'utf8');
          if (!readme.startsWith('# ORBIT')) throw new Error('README is not branded ORBIT');
          if (!launcher.includes('ORBIT DISCORD CONTROL')) throw new Error('Launcher is not branded ORBIT');

          const env = fs.readFileSync('.env.example', 'utf8');
          for (const token of ['ORBIT_SOCIAL_RELAY_URL=', 'ORBIT_SOCIAL_RELAY_TOKEN=']) {
            if (!env.includes(token)) throw new Error(`Orbit relay config missing: ${token}`);
          }

          for (const file of [
            'src/creator-social-providers.js',
            'src/creator-instagram-keyless.js',
            'src/creator-instagram-imginn.js',
            'src/creator-social-provider-router.js',
            'src/creator-social-runtime.js',
            'src/creator-twitch-clips.js',
            'tests/creator-twitch-clips.test.js'
          ]) {
            if (!fs.existsSync(file)) throw new Error(`Missing ${file}`);
          }
          if (fs.existsSync('src/creator-social-browser.js')) throw new Error('Local browser social fallback must stay retired');

          const router = fs.readFileSync('src/creator-social-provider-router.js', 'utf8');
          for (const token of ['x.pcstyle.dev/api/v1/profiles/', "require('./creator-instagram-imginn')", "require('./creator-instagram-keyless')", 'imginn-relay', 'SCRAPECREATORS_API_KEY', 'ORBIT_SOCIAL_RELAY_URL', 'Orbit-Discord-Control/0.29', 'orbit-relay']) {
            if (!router.includes(token)) throw new Error(`Provider router token missing: ${token}`);
          }
          if (/puppeteer|findBrowserExecutable|creator-social-browser/i.test(router)) throw new Error('Provider router must not use a local browser');

          const api = fs.readFileSync('src/creator-hub-api.js', 'utf8');
          for (const token of ["'instagram'", "'bluesky'", "'x'", "'clip'", 'shouldPublishCheckedRule', 'publishCheckedSnapshot', 'publishError', 'allowPing: false', 'seenClipIds']) {
            if (!api.includes(token)) throw new Error(`Creator API token missing: ${token}`);
          }

          const runtime = fs.readFileSync('src/creator-runtime.js', 'utf8');
          for (const token of ["require('./creator-twitch-clips')", 'fetchTwitchClipStatuses', 'fetchLatestTwitchClip', 'processClipRule', 'seenClipIds', "event === 'clip'", 'ORBIT Creator Hub']) {
            if (!runtime.includes(token)) throw new Error(`Twitch clip runtime token missing: ${token}`);
          }

          const clipProvider = fs.readFileSync('src/creator-twitch-clips.js', 'utf8');
          for (const token of ['/helix/clips?', 'broadcaster_id', 'started_at', 'ended_at', 'created_at', 'creator_name']) {
            if (!clipProvider.includes(token)) throw new Error(`Twitch clip provider token missing: ${token}`);
          }

          const creatorUi = fs.readFileSync('public/creator-social-extension.js', 'utf8');
          for (const token of ['HELIX LIVE + CLIPS', "['clip', 'Neuer Clip']", '{clipper}', 'Clip ansehen']) {
            if (!creatorUi.includes(token)) throw new Error(`Twitch clip UI token missing: ${token}`);
          }

          const profileApi = fs.readFileSync('src/bot-profile-api.js', 'utf8');
          const profileUi = fs.readFileSync('public/bot-profile.js', 'utf8');
          const profileCss = fs.readFileSync('public/bot-profile.css', 'utf8');
          for (const token of ['/members/@me', 'avatar', 'bio', 'PermissionFlagsBits.ChangeNickname']) {
            if (!profileApi.includes(token)) throw new Error(`Bot Profile API token missing: ${token}`);
          }
          if (/GLOBAL · GESPERRT|function activityMarkup|bp-activity/.test(profileUi) || /\.bp-activity/.test(profileCss)) {
            throw new Error('Retired activity section still exists in Bot Profile UI');
          }
          if (/setPresence\s*\(|setActivity\s*\(/.test(profileUi) || /setPresence\s*\(|setActivity\s*\(/.test(profileApi)) {
            throw new Error('Shared Bot Profile must never fake per-guild presence/activity');
          }

          if (!pkg.dependencies?.impit) throw new Error('impit dependency missing');
          console.log('ORBIT v0.30.0 product contract verified');
          NODE

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Load core modules
        run: |
          node -e "require('./src/creator-social-providers'); require('./src/creator-instagram-keyless'); require('./src/creator-instagram-imginn'); require('./src/creator-social-provider-router'); require('./src/creator-social-runtime'); require('./src/creator-twitch-clips'); require('./src/bot-profile-utils'); console.log('Core modules loaded')"
          node -e "import('impit').then(m => { if (!m.Impit) process.exit(1); console.log('impit transport loaded') })"

      - name: Run automated tests
        run: node --test tests/*.test.js
