name: JavaScript Quality Gate

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find src public tests -type f -name '*.js' -print0)

      - name: Check CSS syntax sanity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap(entry => {
              const full = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(full) : [full];
            });
          }
          function checkCss(file) {
            const text = fs.readFileSync(file, 'utf8');
            let braces = 0, quote = null, comment = false, escape = false;
            for (let i = 0; i < text.length; i += 1) {
              const ch = text[i], next = text[i + 1];
              if (comment) { if (ch === '*' && next === '/') { comment = false; i += 1; } continue; }
              if (quote) {
                if (escape) { escape = false; continue; }
                if (ch === '\\') { escape = true; continue; }
                if (ch === quote) quote = null;
                continue;
              }
              if (ch === '/' && next === '*') { comment = true; i += 1; continue; }
              if (ch === '"' || ch === "'") { quote = ch; continue; }
              if (ch === '{') braces += 1;
              if (ch === '}') braces -= 1;
              if (braces < 0) throw new Error(`${file}: unexpected closing brace`);
            }
            if (comment || quote || braces !== 0) throw new Error(`${file}: invalid CSS structure`);
            console.log(`CSS OK ${file}`);
          }
          for (const file of walk('public').filter(file => file.endsWith('.css'))) checkCss(file);
          NODE

      - name: Check Orbit and Creator Social contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('public/index.html', 'utf8');
          const required = [
            '/raku-orbit-v610.css',
            '/raku-orbit-v600.js',
            '/raku-module-shell.css',
            '/raku-module-shell.js',
            '/creator-social-extension.css',
            '/creator-social-extension.js'
          ];
          for (const asset of required) {
            const count = html.split(asset).length - 1;
            if (count !== 1) throw new Error(`Expected exactly one ${asset} reference, found ${count}`);
          }
          if (!html.includes('v=0260')) throw new Error('v0.26 cache key missing');
          for (const file of ['src/creator-social-providers.js', 'src/creator-social-runtime.js']) {
            if (!fs.existsSync(file)) throw new Error(`Missing ${file}`);
          }
          const api = fs.readFileSync('src/creator-hub-api.js', 'utf8');
          for (const token of ["'instagram'", "'bluesky'", "'x'", "new Set(['post'])"]) {
            if (!api.includes(token)) throw new Error(`Creator Social API token missing: ${token}`);
          }
          const providers = fs.readFileSync('src/creator-social-providers.js', 'utf8');
          for (const token of ['syndication.twitter.com', '__NEXT_DATA__', 'web_profile_info', 'parseInstagramRelayHtml', "mode: 'public-syndication'", "mode: 'public-web'"]) {
            if (!providers.includes(token)) throw new Error(`Keyless provider token missing: ${token}`);
          }
          if (providers.includes('X Provider ist nicht konfiguriert. X_BEARER_TOKEN fehlt.')) throw new Error('X still hard-requires a bearer token');
          if (providers.includes('INSTAGRAM_GRAPH_ACCESS_TOKEN und INSTAGRAM_GRAPH_IG_USER_ID fehlen.')) throw new Error('Instagram still hard-requires Graph credentials');
          const socialUi = fs.readFileSync('public/creator-social-extension.js', 'utf8');
          for (const token of ['PUBLIC POST INDEX', 'PUBLIC SYNDICATION', 'kein API-Key nötig', 'appendProviderCards']) {
            if (!socialUi.includes(token)) throw new Error(`Creator Social UI token missing: ${token}`);
          }
          console.log('Orbit + keyless Creator Social v0.26 contract verified');
          NODE

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Load creator social modules
        run: |
          node -e "require('./src/creator-social-providers'); require('./src/creator-social-runtime'); console.log('Creator social modules loaded')"

      - name: Run automated tests
        run: node --test tests/*.test.js
