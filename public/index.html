<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>RAKU Discord Control</title>
  <link rel="stylesheet" href="/styles.css?v=040">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar">
      <a class="brand" href="/" aria-label="RAKU Discord Control">
        <span class="brand-mark">R</span>
        <span class="brand-copy"><strong>RAKU</strong><small>Discord Control</small></span>
      </a>

      <div id="sidebarContext" class="sidebar-context"></div>
      <nav id="sidebarNav" class="sidebar-nav" aria-label="Navigation"></nav>

      <div class="sidebar-footer">
        <div id="globalStatus" class="system-status">
          <span class="system-dot"></span>
          <div><strong>Systemstatus</strong><small>Wird geprüft …</small></div>
        </div>
      </div>
    </aside>

    <section class="workspace">
      <header class="topbar">
        <div id="breadcrumb" class="breadcrumb"><span>Control Center</span></div>
        <div id="userArea" class="user-area"></div>
      </header>

      <main class="main-content">
        <section id="loggedOut" class="view hidden auth-view"></section>
        <section id="serverList" class="view hidden"></section>
        <section id="guildDashboard" class="view hidden"></section>
      </main>
    </section>
  </div>

  <div id="saveDock" class="save-dock hidden" role="status" aria-live="polite"></div>
  <div id="toastHost" class="toast-host" aria-live="polite"></div>
  <script src="/app.js?v=040"></script>
</body>
</html>
